name: Documentation site
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - name: Build (strict)
        run: mkdocs build --strict --config-file website/mkdocs.yml --site-dir ../_site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

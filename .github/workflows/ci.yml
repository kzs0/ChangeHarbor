name: Go validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: go-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - name: Validate and build
        env:
          CGO_ENABLED: '1'
        run: just check build
      - name: Replay offline invariants
        run: ./bin/reviewd evaluate --fixtures testdata/evaluation.json
